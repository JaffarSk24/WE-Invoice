name: Release

# Builds the macOS (universal, ad-hoc signed) and Windows (NSIS x64)
# installers and puts them, with latest-mac.yml and latest.yml, into a draft
# GitHub Release. Run by hand only, on the owner's decision; the owner reads
# the draft and publishes it. Publishing then runs release-check.yml on the
# published files.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.0.0 (must match package.json)
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Release gates
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version matches package.json
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
      - name: No release with this tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::Release v${{ inputs.version }} is already published"; exit 1
          fi
      - run: npm run lint
      - name: Unit tests with complete translations
        run: npm test
        env:
          I18N_STRICT: '1'
      - name: Legislation values verified
        run: node scripts/check-legislation.mjs --strict

  build:
    name: Build ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --universal
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Google sign-in client for the desktop app
        shell: bash
        env:
          OAUTH_DESKTOP: ${{ secrets.GOOGLE_OAUTH_DESKTOP }}
        run: |
          if [ -z "$OAUTH_DESKTOP" ]; then echo "::error::No GOOGLE_OAUTH_DESKTOP secret: a release needs the Google sign-in client"; exit 1; fi
          printf '%s' "$OAUTH_DESKTOP" > oauth-credentials.json
          node -e "const c=require('./oauth-credentials.json'); if(!c.clientId||!c.clientSecret) { console.error('oauth-credentials.json needs clientId and clientSecret'); process.exit(1); }"
      - run: npm run build
      - name: Build the installers
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Installer files
        shell: bash
        run: ls -la release.nosync
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release.nosync/*.dmg
            release.nosync/*.zip
            release.nosync/*.exe
            release.nosync/*.blockmap
            release.nosync/latest*.yml

  draft:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - name: Release notes (docs/release-notes/<version>.md, else the changelog)
        run: |
          node -e "
            const fs = require('fs');
            const notes = 'docs/release-notes/${{ inputs.version }}.md';
            if (fs.existsSync(notes)) { fs.copyFileSync(notes, 'notes.md'); process.exit(0); }
            const text = fs.readFileSync('docs/CHANGELOG.md', 'utf8');
            const m = text.split(/^## /m).find(s => s.startsWith('[${{ inputs.version }}]') || s.startsWith('${{ inputs.version }}'));
            fs.writeFileSync('notes.md', m ? '## ' + m.trim() + '\n' : 'WE Invoice ${{ inputs.version }}\n');
          "
          cat notes.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          ls -la release
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --draft --title "WE Invoice $tag" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          echo "Draft release $tag is ready for the owner to publish."
