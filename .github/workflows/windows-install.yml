name: Windows install

# Installs the app on Windows with Microsoft Defender switched on, the way a
# user would (desktop/scripts/check-windows-install.ps1). Runs by hand, and
# on a push to develop only when it changes what goes into the installer or
# runs in the app's main process (desktop/scripts/packaging-changed.cjs):
# interface changes cannot break the installation, and the published
# installer of every release is checked by release-check.yml.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      repeat:
        description: Install and uninstall this many times before the full check
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  changes:
    name: Does the push change the installer
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.check.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node desktop/scripts/packaging-changed.cjs "$BEFORE" "$AFTER" | tee -a "$GITHUB_OUTPUT"

  windows-install:
    name: Windows install with Microsoft Defender
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.packaging == 'true')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the installer
        run: npx electron-builder --win --x64 --publish never
      - name: Install, run, update and uninstall
        shell: pwsh
        run: ./desktop/scripts/check-windows-install.ps1 -Repeat ${{ inputs.repeat || 0 }}
