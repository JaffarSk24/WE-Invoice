name: Release check

# Checks the files that users actually download: the published release, not
# a fresh CI build. Runs when a release is published and by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0 (empty means the latest release)
        required: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer from the release
    runs-on: windows-latest
    # The verdict on the release: install, start, update and uninstall.
    # Defender is checked in the next job, which may take its time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the installer and check its checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $tag = $env:TAG
          if (-not $tag) { $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName }
          Write-Host "Release: $tag"
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'WE-Invoice-*-win-x64.exe' --pattern 'latest.yml' --dir asset
          $exe = Get-ChildItem asset -Filter '*.exe' | Select-Object -First 1
          $expected = (Select-String -Path asset/latest.yml -Pattern '^sha512:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $actual = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($exe.FullName)))
          if ($expected -ne $actual) { Write-Host "::error::Checksum of $($exe.Name) does not match latest.yml"; exit 1 }
          Write-Host "Checksum matches latest.yml: $($exe.Name)"
          "INSTALLER=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install, run, update and uninstall
        shell: pwsh
        run: ./desktop/scripts/check-windows-install.ps1 -Installer $env:INSTALLER -ExpectGoogleClient -SkipDefender

  windows-defender:
    name: Windows installer under Defender (advisory)
    runs-on: windows-latest
    # Defender on a GitHub runner is sometimes slow or broken; its findings
    # are reported here without holding up or failing the release check.
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the installer and check its checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $tag = $env:TAG
          if (-not $tag) { $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName }
          Write-Host "Release: $tag"
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'WE-Invoice-*-win-x64.exe' --pattern 'latest.yml' --dir asset
          $exe = Get-ChildItem asset -Filter '*.exe' | Select-Object -First 1
          $expected = (Select-String -Path asset/latest.yml -Pattern '^sha512:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $actual = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($exe.FullName)))
          if ($expected -ne $actual) { Write-Host "::error::Checksum of $($exe.Name) does not match latest.yml"; exit 1 }
          Write-Host "Checksum matches latest.yml: $($exe.Name)"
          "INSTALLER=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install with Defender protection on, scan and uninstall
        shell: pwsh
        run: ./desktop/scripts/check-windows-install.ps1 -Installer $env:INSTALLER -ExpectGoogleClient

  macos:
    name: macOS app from the release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Download both Mac builds and check their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "Release: $tag"
          # One build per CPU since 0.1.9: arm64 (Apple silicon) and x64 (Intel).
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'WE-Invoice-*-mac-arm64.zip' --pattern 'WE-Invoice-*-mac-x64.zip' --pattern 'latest-mac.yml' --dir asset
          for cpu in arm64 x64; do
            zip=$(ls asset/*-mac-$cpu.zip)
            name=$(basename "$zip")
            expected=$(awk -v n="$name" '$0 ~ "url: "n"$" {getline; sub(/.*sha512: */, ""); print; exit}' asset/latest-mac.yml)
            actual=$(shasum -a 512 "$zip" | cut -d' ' -f1 | xxd -r -p | base64)
            [ "$expected" = "$actual" ] || { echo "::error::Checksum of $name does not match latest-mac.yml"; exit 1; }
            echo "Checksum matches latest-mac.yml: $name ($(du -m "$zip" | cut -f1) MB)"
            ditto -x -k "$zip" "app-$cpu"
          done
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Signature, CPU, version and Google sign-in client of each build
        run: |
          set -euo pipefail
          for cpu in arm64 x64; do
            app="app-$cpu/WE Invoice.app"
            codesign --verify --deep --strict "$app"
            arch=$([ "$cpu" = arm64 ] && echo arm64 || echo x86_64)
            lipo -archs "$app/Contents/MacOS/WE Invoice" | grep -qx "$arch" || { echo "::error::The $cpu build is not $arch only: $(lipo -archs "$app/Contents/MacOS/WE Invoice")"; exit 1; }
            version=$(defaults read "$PWD/$app/Contents/Info.plist" CFBundleShortVersionString)
            [ "$version" = "$VERSION" ] || { echo "::error::App version $version in the $cpu build, release $VERSION"; exit 1; }
            npx --yes @electron/asar list "$app/Contents/Resources/app.asar" | grep -q '^/oauth-credentials.json$' \
              || { echo "::error::The $cpu build has no Google sign-in client (oauth-credentials.json)"; exit 1; }
            echo "$cpu build: signature valid, $arch, version $version, Google sign-in client bundled"
          done
      - name: Start the app and let it run
        run: |
          set -uo pipefail
          export WE_INVOICE_USER_DATA="$RUNNER_TEMP/we-invoice-data"
          # The runner is an Apple silicon Mac: its own build is the arm64 one.
          "app-arm64/WE Invoice.app/Contents/MacOS/WE Invoice" > app.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "Running after 20 seconds"
            kill "$pid"
          else
            echo "::error::The app quit by itself"; cat app.log; exit 1
          fi
          [ -d "$WE_INVOICE_USER_DATA" ] || { echo "::error::The app did not create its data folder"; exit 1; }
          echo "Data folder created"
