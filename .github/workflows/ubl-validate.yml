name: UBL validation

# Validates the UBL built from every fixture case (tests/fixtures/ubl) with
# the official rules (04-peppol.md § 4.8):
#   - OASIS UBL 2.1 schema (element order, unknown elements);
#   - OpenPeppol BIS Billing 3.0.21 rules (PEPPOL-EN16931-UBL, release 2026.5)
#     and the CEN EN 16931 rules shipped with that release;
#   - CEN/TC 434 EN 16931 UBL validation 1.3.17 (ConnectingEurope).
# The Schematron rules are distributed as XSLT 2.0 and run with Saxon-HE
# (MPL-2.0) on the Java that the runner already has; the compiled Peppol
# XSLT comes from phive-rules-peppol (Apache-2.0), the schemas from ph-ubl21
# and ph-xsds (Apache-2.0). Every download is pinned by version and SHA-256.
# SaxonJS / xslt3 is not used: its licence is not an open source licence.

on:
  push:
    paths: ['packages/core/ubl/**', 'packages/core/vat/**', 'tests/fixtures/ubl/**', '.github/workflows/ubl-validate.yml']
  pull_request:
    paths: ['packages/core/ubl/**', 'packages/core/vat/**', 'tests/fixtures/ubl/**', '.github/workflows/ubl-validate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: UBL schema, EN 16931 and Peppol BIS 3
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UBL unit tests
        run: npx vitest run packages/core/ubl
      - name: Download the validation artefacts
        run: |
          set -euo pipefail
          echo "RULES=$RUNNER_TEMP/ubl-rules" >> "$GITHUB_ENV"
          RULES="$RUNNER_TEMP/ubl-rules"
          mkdir -p "$RULES" && cd "$RULES"
          M=https://repo1.maven.org/maven2
          cat > sources.txt <<EOF
          98c3a91e6e5aaf9b3e2b37601e04b214a6e67098493cdd8232fcb705fddcb674 Saxon-HE-12.5.jar $M/net/sf/saxon/Saxon-HE/12.5/Saxon-HE-12.5.jar
          efc92bd7ed32b3e57095e0b3e872051ccfbbdcc980831ef33e89e38161a85222 xmlresolver-5.2.2.jar $M/org/xmlresolver/xmlresolver/5.2.2/xmlresolver-5.2.2.jar
          8d746eed379b5e9e8cd58530e1b8a7931786d089fb94d785e99b9be142c0431b phive-rules-peppol-4.6.3.jar $M/com/helger/phive/rules/phive-rules-peppol/4.6.3/phive-rules-peppol-4.6.3.jar
          0bb13039b0f0983df9cf8c6f98b1f0f0c992bbd9ae2196766573e61607402405 ph-ubl21-10.2.1.jar $M/com/helger/ubl/ph-ubl21/10.2.1/ph-ubl21-10.2.1.jar
          85119e35f3239932aeef4f6a963cb35ba7ec03e486f5f33acb9203b39b0e8728 ph-xsds-ccts-cct-schemamodule-4.1.1.jar $M/com/helger/xsd/ph-xsds-ccts-cct-schemamodule/4.1.1/ph-xsds-ccts-cct-schemamodule-4.1.1.jar
          1b5c1a2680cb254afc5032e3588604516e0a5a6856084d7349ef9c60fb073de5 ph-xsds-xmldsig-4.1.1.jar $M/com/helger/xsd/ph-xsds-xmldsig/4.1.1/ph-xsds-xmldsig-4.1.1.jar
          cd39b78653ac86f5b37ecc6a94c64af0827725759794488cf8ba457bafc98d2f ph-xsds-xades132-4.1.1.jar $M/com/helger/xsd/ph-xsds-xades132/4.1.1/ph-xsds-xades132-4.1.1.jar
          07980395ab4e5d86b03a952f05100073148d0e381bb0de05dabc5e6600106938 ph-xsds-xades141-4.1.1.jar $M/com/helger/xsd/ph-xsds-xades141/4.1.1/ph-xsds-xades141-4.1.1.jar
          60341f616c6e716dd43a1c5270d26bb2e532e4fe56b073162cca7477780993b6 EN16931-UBL-validation-1.3.17.xslt https://raw.githubusercontent.com/ConnectingEurope/eInvoicing-EN16931/validation-1.3.17/ubl/xslt/EN16931-UBL-validation.xslt
          EOF
          while read -r sum name url; do
            curl -fsSL --retry 3 -o "$name" "$url"
            echo "$sum  $name" | sha256sum -c -
          done < sources.txt
          unzip -q -j phive-rules-peppol-4.6.3.jar 'external/schematron/openpeppol/2026.5/xslt/PEPPOL-EN16931-UBL.xslt' 'external/schematron/openpeppol/2026.5/xslt/CEN-EN16931-UBL.xslt'
          mkdir xsd
          unzip -q ph-ubl21-10.2.1.jar 'external/schemas/ubl21/*' -d xsd
          for jar in ph-xsds-*.jar; do unzip -q -o "$jar" 'schemas/*' -d xsd; done
      - name: Write the fixture XML
        run: node tests/fixtures/ubl/write-xml.js "$RULES/out"
      - name: UBL 2.1 schema
        run: java tests/fixtures/ubl/XsdValidate.java "$RULES/xsd" "$RULES"/out/*.xml
      - name: Schematron EN 16931 and Peppol BIS 3
        run: >
          node tests/fixtures/ubl/validate-schematron.js
          "$RULES/Saxon-HE-12.5.jar:$RULES/xmlresolver-5.2.2.jar"
          "$RULES/PEPPOL-EN16931-UBL.xslt" "$RULES/CEN-EN16931-UBL.xslt" "$RULES/EN16931-UBL-validation-1.3.17.xslt"
