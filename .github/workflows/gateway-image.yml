name: Gateway image

# Builds the gateway Docker image and pushes it to GitHub Container
# Registry. It does not deploy anything. Run by hand only.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: gateway
          push: true
          tags: ghcr.io/jaffarsk24/we-invoice-gateway:${{ github.sha }},ghcr.io/jaffarsk24/we-invoice-gateway:latest
