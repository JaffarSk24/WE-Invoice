# nginx vhost of the WE Invoice gateway: invoice-api.whiteeagles.sk to the
# gateway on 127.0.0.1:8787. Install as
# /etc/nginx/sites-available/invoice-api.whiteeagles.sk and enable it, then
# let certbot add the certificate (deploy/README.md).
#
# Logging: the access log never contains the query string or any header.
# Requests to /v1/proxy/ carry provider API keys in headers and bodies and
# provider paths in the URL, so that location logs nothing at all.
# $uri is the path without the query; register look-ups (IČO, VAT number)
# are public data.

log_format gateway_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

upstream we_invoice_gateway {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name invoice-api.whiteeagles.sk;

    # certbot --nginx adds the redirect to https here

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name invoice-api.whiteeagles.sk;

    # certbot --nginx fills in ssl_certificate and ssl_certificate_key
    # ssl_certificate /etc/letsencrypt/live/invoice-api.whiteeagles.sk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/invoice-api.whiteeagles.sk/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/invoice-api.access.log gateway_safe;
    error_log /var/log/nginx/invoice-api.error.log warn;

    # Proxy bodies up to 15 MB (the gateway enforces the exact limit)
    client_max_body_size 16m;
    client_body_timeout 60s;

    # The provider proxy: no logging at all, no buffering (streams)
    location /v1/proxy/ {
        access_log off;
        proxy_pass http://we_invoice_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /v1/ {
        proxy_pass http://we_invoice_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
