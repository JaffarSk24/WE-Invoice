<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="tile-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheet-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="sheet-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0e1a" flood-opacity="0.35"/>
    </filter>
    <filter id="seal-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b0e1a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#2e354f" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile-light)"/>

  <!-- The sheet behind, in the WE Invoice accent -->
  <g transform="rotate(-9 470 470)">
    <rect x="262" y="226" width="400" height="520" rx="40" fill="url(#sheet-back)"/>
    <rect x="262" y="306" width="400" height="34" fill="#0f172a" fill-opacity="0.22"/>
  </g>

  <!-- The invoice: a white sheet with a folded corner -->
  <g filter="url(#sheet-shadow)">
    <path d="M374 238 H620 L732 350 V786 a42 42 0 0 1 -42 42 H374 a42 42 0 0 1 -42 -42 V280 a42 42 0 0 1 42 -42 Z" fill="#ffffff"/>
  </g>
  <path d="M620 238 V318 a32 32 0 0 0 32 32 H732 Z" fill="#e1e5f0"/>

  <!-- Header and lines of the document -->
  <rect x="382" y="296" width="168" height="40" rx="20" fill="url(#accent)"/>
  <rect x="382" y="396" width="300" height="20" rx="10" fill="#e7eaf3"/>
  <rect x="382" y="446" width="250" height="20" rx="10" fill="#e7eaf3"/>
  <rect x="382" y="496" width="280" height="20" rx="10" fill="#e7eaf3"/>
  <rect x="382" y="572" width="140" height="28" rx="14" fill="#c9cfe0"/>

  <!-- Paid seal -->
  <g filter="url(#seal-shadow)">
    <circle cx="676" cy="720" r="112" fill="url(#accent)"/>
  </g>
  <circle cx="676" cy="720" r="112" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.9"/>
  <path d="M624 722 L660 758 L730 684" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
